  <body>
    <main id="demo">
      <noscript>
        <h1>Wetplate</h1>
        <p>
          An FFGL effect that exposes your clip onto a collodion wet plate. The
          plate only sees blue and ultraviolet, weighted by a published
          sensitivity curve integrated against a spectrum built from each
          pixel's RGB, and it's slow, gathering light over a sliding window of
          seconds, so anything that moved is a ghost as dense as the fraction of
          the exposure it stayed for. Reds go black and skies go white, motion
          stacks up into ghosts, a take exposes and then holds the developed
          plate, and the hand-poured coating drains towards one corner, with a
          bare pour edge and dust comets. Tintype, ambrotype or glass negative.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/wetplate">its repository</a>.
        </p>
