name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # WETPLATE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # wttest is the only place the physics is written down as a number,
        # so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DWETPLATE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/wttest --list

      - name: Physics
        # The runner has no accelerated GL; the harness falls back to a
        # software context. 320x180, because software rasterisation is slow
        # and every check here was written to hold at any raster: the wedges
        # sample step centres, the grain's interval is the sample variance's
        # own at whatever n the raster gives, and the wetplate is laid out in
        # film millimetres. verify.sh runs them at 1280x720 as well.
        timeout-minutes: 20
        run: |
          ./build/wttest --names
          ./build/wttest --spectral --size 320x180
          ./build/wttest --ghost    --size 320x180
          ./build/wttest --bucket   --size 320x180
          ./build/wttest --curve    --size 320x180
          ./build/wttest --drainage --size 320x180
          ./build/wttest --take     --size 320x180
          ./build/wttest --resize   --size 320x180
          ./build/wttest --negative --size 320x180

      - name: Weights
        run: python3 tools/spectral_weights.py --check

      - name: Controls
        # At 160x90 and two at a time, because the runner has no GPU and the
        # question is only whether a control changed ANY subpixel. Graticule's
        # first run of this step at 320x180 was still going at twenty minutes.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 160x90 --jobs 2

      - uses: actions/upload-artifact@v4
        with:
          name: wetplate-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DWETPLATE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: wetplate-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
